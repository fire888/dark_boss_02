<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
    <title>Walking_09</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
      <meta name="-ms-viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <meta http-equiv="content-type" content="text/html; charset=utf-8" />
      <meta name="theme-color" content="#ffffff" />
      <meta name="color-scheme" content="light only">
      <meta name="apple-mobile-web-app-status-bar-style" content="white" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-touch-fullscreen" content="yes" />
      <meta name="msapplication-tap-highlight" content="no" />
    <style>
        * {
            padding: 0;
            margin: 0;
        }     
        .mode-switch {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .mode-switch button {
            background-color: #0e0924;
            border: 2px solid #a1ccea;
            color: #a1ccea;
            font: bold 12px monospace;
            padding: 5px 10px;
            cursor: pointer;
        }
        .mode-switch button.active {
            background-color: #a1ccea;
            color: #0e0924;
        }
    </style>
</head>
<body>
    <div class="mode-switch">
        <button data-mode="orbit">orbit</button><button data-mode="walk">walk</button>
    </div>
    <div id="container-game" touch-action="none"></div>
    <div id='cont-level-dev'></div> 
</body>
</html>
